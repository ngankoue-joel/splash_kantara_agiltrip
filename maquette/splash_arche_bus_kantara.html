<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kantara AgilTrip · splash screen (arche + bus)</title>
<style>
:root{--bf:#16318C;--b:#2958C2;--j:#FEC722;--txt:#14213D}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#E9EDF5;font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);display:flex;flex-direction:column;align-items:center}
header{padding:20px 16px 4px;text-align:center}
h1{margin:0;font-size:20px;color:var(--bf)}
header p{margin:6px 0 0;color:#5B6475;font-size:13.5px}
.boutons{display:flex;gap:10px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer}
.btn-j{background:var(--j);color:var(--bf)}
.btn-c{background:#fff;color:var(--bf);border:2px solid var(--bf)}
.scene{padding:14px 16px 30px}
.ph{width:300px;height:620px;border-radius:42px;border:9px solid #1C2440;overflow:hidden;position:relative;box-shadow:0 16px 34px rgba(0,0,0,.2);background:#fff}
.apres{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.etiquette{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;opacity:0;z-index:5;white-space:nowrap}
.splash{position:absolute;inset:0;overflow:hidden;background:var(--bf)}
.c{position:absolute;border-radius:50%}
.marque{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transform-origin:50% 50%}
.nm{font-weight:800;line-height:1.05;font-size:28px;text-align:center}
.k{color:#fff}.a{color:var(--j)}
.sub{color:#fff;opacity:.85;font-size:12.5px;letter-spacing:.4px}
.charge{position:absolute;bottom:38px;left:50%;margin-left:-50px;width:100px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.charge i{display:block;height:100%;background:var(--j);border-radius:5px;transform-origin:left;transform:scaleX(0)}
.route{position:absolute;left:0;right:0;top:420px;height:46px;background:#0F2468}
.tirets{position:absolute;left:0;right:0;top:441px;height:4px;background:repeating-linear-gradient(90deg,var(--j) 0 22px,transparent 22px 40px)}
.bus{position:absolute;top:392px;left:93px;width:100px;height:44px;background:var(--j);border-radius:10px 16px 6px 6px}
.vitre{position:absolute;top:7px;left:8px;width:64px;height:14px;background:var(--bf);border-radius:3px;opacity:.85}
.porte{position:absolute;top:7px;right:7px;width:15px;height:21px;background:var(--bf);border-radius:3px;opacity:.85}
.roue{position:absolute;width:17px;height:17px;border-radius:50%;background:#1C2440;border:3px solid #fff;bottom:-9px}
.roue::after{content:"";position:absolute;left:50%;top:1px;width:2px;height:5px;margin-left:-1px;background:#fff;border-radius:1px}
.vitesse{position:absolute;height:3px;border-radius:3px;background:rgba(255,255,255,.45)}
.trajet{position:absolute;bottom:74px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px}
/* état de départ */
.carre,.nm,.sub,.point,.route,.tirets,.bus,.trajet,.vitesse{opacity:0}
.socle{transform:scaleX(0)}
.arche{stroke-dasharray:48;stroke-dashoffset:48}
.carre,.socle{transform-box:fill-box;transform-origin:center}
/* ---------- chronologie (sous .play) ---------- */
/* Acte 1 : l'arche */
.play .carre{animation:pop 0.72s cubic-bezier(.2,.8,.3,1.2) 0.24s both}
.play .socle{animation:barre 0.64s ease-out 0.64s both}
.play .arche{animation:trace 1.12s ease-in-out 0.88s both}
.play .nm{animation:monte 0.72s ease-out 1.76s both}
.play .sub{animation:monte 0.72s ease-out 2.16s both,disparait 0.48s ease 3.12s forwards}
.play .point{animation:pop 0.64s ease 2.4s both,disparait 0.48s ease 3.12s forwards}
.play .charge i{animation:barre 2.88s cubic-bezier(.4,0,.2,1) 0.16s both}
.play .charge{animation:disparait 0.48s ease 3.12s forwards}
/* Transition : le logo monte et laisse la place à la route */
.play .marque{animation:monteMarque 1.04s cubic-bezier(.4,0,.2,1) 3.2s both}
.play .rond-bas{animation:sortBas 0.96s ease-in 3.2s both}
/* Acte 2 : le bus */
.play .route{animation:route 0.72s ease-out 3.6s both}
.play .tirets{animation:fondu 0.48s ease 3.68s both,defile 0.56s linear 3.68s 5}
.play .bus{animation:arrive 2.08s cubic-bezier(.15,.75,.3,1) 3.84s both}
.play .roue{animation:tourne 0.48s linear 3.84s 4}
.play .vitesse{animation:vit 2.24s ease 3.84s both}
.play .trajet{animation:monte 0.72s ease-out 5.6s both}
/* Sortie vers l'accueil */
.play .splash{animation:sortie 0.72s ease 7.04s both}
.play .etiquette{animation:fondu 0.48s ease 7.68s both}
@keyframes pop{0%{opacity:0;transform:scale(.55)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes disparait{to{opacity:0}}
@keyframes trace{from{stroke-dashoffset:48}to{stroke-dashoffset:0}}
@keyframes barre{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes monteMarque{to{transform:translateY(-150px) scale(.82)}}
@keyframes sortBas{to{transform:translate(-70px,90px);opacity:0}}
@keyframes route{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes defile{from{background-position:0 0}to{background-position:-40px 0}}
@keyframes arrive{0%{opacity:1;transform:translateX(-280px)}80%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes vit{0%,15%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes sortie{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@media (prefers-reduced-motion:reduce){.play *{animation-duration:0.02s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.chrono{font-size:12px;color:#6B7280;text-align:center;max-width:300px;margin:12px auto 0;line-height:1.5}
</style></head><body>
